name: Platform Builds

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check CI result
        run: echo "Proceeding with platform builds"

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Create platform dirs
        run: flutter create . --project-name memo_app --org com.memo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 14

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Create platform dirs
        run: flutter create . --project-name memo_app --org com.memo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (simulator)
        run: flutter build ios --release --no-codesign

      - name: Package iOS build
        run: ditto -c -k --sequesterRsrc build/ios/iphoneos/Runner.app memo_app-ios.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ios-build
          path: memo_app-ios.zip
          retention-days: 14

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Create platform dirs
        run: flutter create . --project-name memo_app --org com.memo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: flutter build web --release

      - name: Package Web build
        run: cd build/web && zip -r ../../memo_app-web.zip .

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: web-build
          path: memo_app-web.zip
          retention-days: 14

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Install VS2019 Build Tools
        shell: pwsh
        run: choco install visualstudio2019buildtools --package-parameters "--quiet --wait --norestart --nocache --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended" -y --force

      - name: Create platform dirs
        run: flutter create . --project-name memo_app --org com.memo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath memo_app-windows-x64.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: memo_app-windows-x64.zip
          retention-days: 14

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Create platform dirs
        run: flutter create . --project-name memo_app --org com.memo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS build
        run: ditto -c -k --sequesterRsrc build/macos/Build/Products/Release/memo_app.app memo_app-macos.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-build
          path: memo_app-macos.zip
          retention-days: 14

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Install platform deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Create platform dirs
        run: flutter create . --project-name memo_app --org com.memo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux build
        run: tar -czf memo_app-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-build
          path: memo_app-linux-x64.tar.gz
          retention-days: 14

  publish-nightly:
    name: Publish Nightly Release
    runs-on: ubuntu-latest
    needs: [gate, build-android, build-ios, build-web, build-windows, build-macos, build-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Remove the previous nightly release and its tag, then re-point the tag at this commit.
          gh release delete nightly --yes --cleanup-tag || true
          gh api -X POST repos/$GITHUB_REPOSITORY/git/refs \
            -f ref=refs/tags/nightly \
            -f sha=$GITHUB_SHA

          mapfile -d '' files < <(
            find artifacts -type f \( \
              -name '*.apk' -o -name '*.aab' -o -name '*.zip' -o -name '*.tar.gz' \
            \) -print0
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No build artifacts found to publish"
            exit 1
          fi

          gh release create nightly "${files[@]}" \
            --title "Nightly Build ($(date -u +%Y-%m-%d))" \
            --notes "Automated build from commit ${GITHUB_SHA:0:7} on main." \
            --prerelease
