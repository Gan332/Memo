name: Platform Builds

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check CI result
        run: echo "Proceeding with platform builds"

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Create platform dirs
        run: flutter create . --project-name memo_app --org com.memo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 14

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Create platform dirs
        run: flutter create . --project-name memo_app --org com.memo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (simulator)
        run: flutter build ios --release --no-codesign

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 14

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Create platform dirs
        run: flutter create . --project-name memo_app --org com.memo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: flutter build web --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: web-build
          path: build/web/
          retention-days: 14

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Install VS2019 Build Tools
        shell: pwsh
        run: choco install visualstudio2019buildtools --package-parameters "--quiet --wait --norestart --nocache --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended" -y --force

      - name: Create platform dirs
        run: flutter create . --project-name memo_app --org com.memo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/
          retention-days: 14

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Create platform dirs
        run: flutter create . --project-name memo_app --org com.memo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS
        run: flutter build macos --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/
          retention-days: 14

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: Install platform deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Create platform dirs
        run: flutter create . --project-name memo_app --org com.memo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux
        run: flutter build linux --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/
          retention-days: 14
