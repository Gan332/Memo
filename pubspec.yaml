name: memo_app
description: 一个简洁优雅的备忘录应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5

  # State management
  provider: ^6.1.2
  shared_preferences: ^2.3.4

  # UI
  intl: ^0.19.0
  flutter_colorpicker: ^1.1.0
  dynamic_color: 1.7.0
  flutter_slidable: ^3.1.1
  uuid: ^4.5.1
  file_picker: ^8.1.7
  flutter_markdown: ^0.7.6
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
